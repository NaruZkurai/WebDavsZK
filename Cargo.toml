[package]
name = "nzk-webdavs"
version = "0.1.0"
edition = "2024"
description = "Robust Rust WebDAVS server tuned for KDE KIO recursive uploads and the KIO WebDAV large-file transfer bug (KDE Bug #422668)"
license = "Apache-2.0"
keywords = ["webdav", "webdavs", "dav", "tls", "kde", "kio", "server"]
categories = ["network-programming", "web-programming"]
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http-body-util = "0.1"
libc = "0.2"
sha2 = "0.10"
dav-server = "0.11"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = { version = "0.4", features = ["std"] }
percent-encoding = "2"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"

[profile.release]
lto = "thin"
codegen-units = 1
